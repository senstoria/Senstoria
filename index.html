<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Senstoria — Pustaka & Penjelajahan Parfum Personal</title>
    <meta name="description" content="Temukan aroma yang menceritakan kisahmu. Pustaka parfum digital, pencatatan pemakaian harian, Scent DNA personal, dan kurasi parfum Indonesia serta internasional." />
    <meta property="og:title" content="Senstoria — Pustaka & Penjelajahan Parfum Personal" />
    <meta property="og:description" content="Temukan aroma yang menceritakan kisahmu. Susun pustaka parfummu. Kenali aroma yang benar-benar cocok untukmu." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Senstoria" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="index, follow" />
    <!-- Favicon: single "S" mark cropped from senstoria-logo.png (founder
         31 Oct 2026 — the full 4125×750 wordmark turns to blur at ~16px
         tab size). og:image / twitter:image and in-app logos still use
         the full wordmark; ONLY this icon link changes. -->
    <link rel="icon" type="image/png" href="/assets/senstoria-mark-s.png" />
    <!-- Tahap 3 PWA (26 Nov 2026): manifest + ikon Apple, dari aset mark-S
         yang sudah ada (D-3). display standalone, start_url "/" — dibuka
         dari Home Screen langsung ke Beranda, tanpa bilah browser. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Senstoria" />
    <meta property="og:image" content="/assets/senstoria-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Senstoria — Pustaka & Penjelajahan Parfum Personal" />
    <meta name="twitter:description" content="Temukan aroma yang menceritakan kisahmu. Susun pustaka parfummu. Kenali aroma yang benar-benar cocok untukmu." />
    <meta name="twitter:image" content="/assets/senstoria-logo.png" />
    <!-- Tahap 0 (26 Nov 2026): canonical diperbaiki dari senstoria.id
         (domain yang tidak pernah dipakai) ke senstoria.app (domain
         produksi yang live sejak 22 Nov 2026). -->
    <link rel="canonical" href="https://senstoria.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Nike Fase 1 (26 Nov 2026, adopsi penuh arah Nike): Archivo
         (display + UI). OFL (SIL Open Font License 1.1, terverifikasi
         di google/fonts ofl/archivo/OFL.txt), dimuat dengan mekanisme
         yang sama seperti font sebelumnya (Google Fonts). Font serif
         dan grotesque lama tidak lagi dimuat. Helvetica Now Text
         adalah font komersial dan TIDAK BOLEH dipakai — file yang
         di-upload founder terbukti demo "Personal Use Only". -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Senstoria",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "description": "Bilingual (EN/ID) fragrance companion for the Indonesian market. Build your Scent DNA, track your collection, log daily wears, and discover perfumes with honest match scores.",
      "url": "https://senstoria.app/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "IDR"
      }
    }
    </script>
  </head>
  <body class="bg-paper text-ink antialiased selection:bg-[#000000] selection:text-[#ffffff]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
